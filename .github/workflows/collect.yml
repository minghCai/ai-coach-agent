# 采集工作流：在 GitHub 的公网出口采集快照。
#
# 只手动触发（Actions 页面点「Run workflow」），刻意不设任何 cron/定时任务。
# 采集结果属业务结果：数据源业务拒绝（code=42000）时如实记录、零写入、不自动重试。
# 注意：钻石狂潮（gameType=4）已被站点下线，请求固定返回业务拒绝 42000（与 IP 无关，非限流），
# 故一键采集只包含「万象大赛」；modes 参数保留，供需要时手动指定。
name: 采集快照

on:
  workflow_dispatch:
    inputs:
      modes:
        description: '采集模式：2=万象大赛（当前唯一可用）。钻石狂潮(gameType=4)已被站点下线，会返回业务拒绝。留空=全部'
        type: string
        default: '2'
      force:
        description: 强制重采（忽略当日已存在的快照）
        type: boolean
        default: false

# 需要把采集结果提交回仓库
permissions:
  contents: write

# 同一时间只允许一轮采集，避免并发写同一批快照
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集
        run: |
          modes="${{ inputs.modes }}"
          args="--all"
          if [ -n "$modes" ]; then args="--modes $modes"; fi
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          echo "执行：node collector/fetch-meta.mjs $args"
          node collector/fetch-meta.mjs $args

      # 用 always()：即使采集被业务拒绝（退出码非 0），已成功落盘的快照也要提交
      - name: 提交快照
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta
          if git diff --cached --quiet; then
            echo "无新增/变更快照，跳过提交"
          else
            git commit -m "chore(snapshot): 采集 $(TZ='Asia/Shanghai' date +%F) 快照"
            git push
          fi
