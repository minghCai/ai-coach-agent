# 采集工作流：在 GitHub 的公网出口采集快照（本机 IP 已被数据源限流封禁）。
#
# 只手动触发（Actions 页面点「Run workflow」），刻意不设任何 cron/定时任务，
# 靠低请求量（每日 0-3 次）天然规避限流；熔断（code=42000）时立即失败、零写入、不重试。
name: 采集快照

on:
  workflow_dispatch:
    inputs:
      force:
        description: 强制重采（忽略当日已存在的快照）
        type: boolean
        default: false

# 需要把采集结果提交回仓库
permissions:
  contents: write

# 同一时间只允许一轮采集，避免并发请求打满限流
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集（万象大赛 + 钻石狂潮·大师场）
        run: |
          args="--all"
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          node collector/fetch-meta.mjs $args

      # 用 always()：即使后一个模式被熔断（退出码非 0），前一个模式已成功落盘的快照也要提交
      - name: 提交快照
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta
          if git diff --cached --quiet; then
            echo "无新增/变更快照，跳过提交"
          else
            git commit -m "chore(snapshot): 采集 $(date -u +%F) 快照"
            git push
          fi
